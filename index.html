<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarImpact - Publicidade</title>
<style>
  body { margin:0; background:#000; color:#fff; font-family: Arial, sans-serif; overflow:hidden; }
 .slide { display:none; width:100vw; height:100vh; object-fit:contain; }
 .slide.active { display:block; }
  #legenda { position: absolute; bottom: 0; width:100%; background: rgba(0,0,0,0.7); padding: 20px; text-align:center; font-size: 2rem; }
</style>
</head>
<body>

<img id="slide1" class="slide active" src="criativos/exemplo1.jpg" alt="Criativo 1">
<video id="slide2" class="slide" src="criativos/exemplo2.mp4" muted loop playsinline></video>
<div id="legenda">CarImpact - Anuncie aqui</div>

<script>
  // Rotação automática a cada 8 segundos
  const slides = document.querySelectorAll('.slide');
  let atual = 0;
  setInterval(() => {
    slides[atual].classList.remove('active');
    atual = (atual + 1) % slides.length;
    slides[atual].classList.add('active');
  }, 8000);
</script>
</body>
</html>
